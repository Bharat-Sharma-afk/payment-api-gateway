spring.application.name=gateway

# --- 1. PostgreSQL (Neon) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# --- 2. Redis (Upstash) ---
spring.data.redis.url=${REDIS_URL}

# --- 3. Kafka (Aiven) ---
spring.kafka.bootstrap-servers=${KAFKA_URL}
kafka.health.topic=${KAFKA_HEALTH_TOPIC:health-topic}

# Aiven SASL Security Configuration
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
spring.kafka.properties.ssl.endpoint.identification.algorithm=https
spring.kafka.properties.ssl.truststore.type=PEM
spring.kafka.properties.ssl.truststore.location=classpath:ca.cert

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
